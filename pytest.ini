[pytest]
asyncio_mode = auto
filterwarnings =
    # Emitted by starlette's TestClient at import time (it wants the `httpx2` package).
    # Not raised by this project's code; revisit when bumping fastapi/starlette.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
